# Semantic field mapping: Akamai Ion (PAPI rule format v2023-01-05) vs Cloudflare v4 API.
#
# Each field names where the equivalent setting lives on each provider. The
# comparison is symmetric: there is no baseline provider — the two sides are
# compared to each other and any disagreement is routed to a human, who
# decides which provider is right and whose Terraform gets the fix.
#
# Whether a field is comparable is answered structurally: a side carrying
# `unsupported: true` cannot express the field at all, so the field is
# `not_comparable`; a side whose path resolves to nothing with the other
# side configured is `missing_at_<provider>` (a migration gap); two resolved
# sides are `equivalent` or a `disagreement` by the field's comparator.
#
# Comparators: exact, bool_eq, numeric_eq, numeric_ge, duration_eq, set_equal,
# semantic_enum, semantic_enum_ge, presence, regex_equivalent.
# Ordered comparators (numeric_ge, semantic_enum_ge) degenerate to equality
# in a peer comparison: two sides are equivalent only if neither is strictly
# weaker than the other.
#
# `allow_absent: true` marks a provider side that may legitimately have no
# configured object: the absence is a `missing_at_<provider>` finding when
# the other side is configured, not a path-resolution error.
# `unsupported: true` means the provider cannot express the field at all —
# the field is not comparable, never a disagreement.
version: "2026.09.4"
rule_format: "v2023-01-05"

# Provider defaults applied when the other side omits the field entirely.
# This is the false-positive suppression layer: a Cloudflare zone-settings
# response that simply does not list a setting at its stock value must not
# produce a finding.
defaults:
  cloudflare_settings:
    http2: "on"
    http3: "on"
    brotli: "on"
    early_hints: "on"
    ip_geolocation: "on"
    tls_1_3: "on"
    always_use_https: "on"
    development_mode: "off"

value_tables:
  tls_min_version:
    akamai: { DYNAMIC: "1.2", TLSV1_2: "1.2", TLSV1_1: "1.1", TLSV1: "1.0", TLSV1_3: "1.3" }
    cloudflare: { "1.0": "1.0", "1.1": "1.1", "1.2": "1.2", "1.3": "1.3" }
  ssl_mode:
    akamai: { SECURE: "strict", STANDARD: "flexible" }
    cloudflare: { off: "off", flexible: "flexible", full: "full", strict: "strict" }
  gzip_mode:
    akamai: { ALWAYS: "on", NEVER: "off" }
    cloudflare: { on: "on", off: "off" }
  cache_key_mode:
    akamai: { EXCLUDE_ALL: "none", IGNORE: "ignore_all", INCLUDE: "subset" }
    cloudflare: { "[]": "none", "*": "ignore_all" }
  sensitivity:
    cloudflare: { low: "low", medium: "medium", high: "high" }
    literal: { low: "low", medium: "medium", high: "high" }
  polish:
    cloudflare: { off: "off", lossless: "lossless", lossy: "lossy" }
    literal: { off: "off", lossless: "lossless", lossy: "lossy" }

# These sections are data, not commentary: they are the source of truth for
# what the flags and comparators mean, and they ship inside each detection
# session's bundle so nothing has to be inferred from a flag's name.

flag_definitions:
  allow_absent: >-
    When true on a provider side, an unresolved provider path is a migration
    gap: report it as a `missing_at_<provider>` finding routed to human
    review when the other side is configured. It is NOT a resolution error
    and NOT permission for the field to be absent -- the gap itself is the
    reportable condition.
  unsupported: >-
    When true on a provider side, that provider cannot express this field at
    all. The field is not comparable -- it can only ever produce a
    `not_comparable` classification, never a disagreement, and no provider
    path is resolved for the unsupported side.

comparator_definitions:
  exact: >-
    Canonicalized values on both sides must be equal in the same order,
    compared as strings.
  bool_eq: >-
    Both sides are coerced to booleans (on/true/1/enabled vs off/false/0/
    disabled) before comparison -- a boolean and a mode string meaning the
    same thing are equal.
  numeric_eq: >-
    Both sides are coerced to numbers before comparison.
  numeric_ge: >-
    Ordered comparator with no baseline in a peer comparison: degenerates
    to numeric equality -- equivalent only if neither side is strictly
    weaker than the other.
  duration_eq: >-
    Durations are normalized to seconds before comparison (s, m, h, d, w
    suffixes supported) -- "4h" and 14400 are equal.
  set_equal: >-
    The union of each side's values, as a set, must be equal -- order is
    never significant.
  semantic_enum: >-
    Values are canonicalized through the field's value table, then compared
    as sorted string sets -- different provider vocabularies for the same
    semantic value are equal.
  semantic_enum_ge: >-
    Like numeric_ge: in a peer comparison it degenerates to equality --
    numeric when both sides parse as numbers (e.g. a TLS version floor),
    exact string equality otherwise.
  presence: >-
    The field must be expressed on both sides: at least one resolved value
    that is not null, empty, or false on each. The value itself is not
    compared.
  regex_equivalent: >-
    Expressions are normalized (whitespace and quotes stripped, lowercased)
    and compared as sorted sets -- syntactic differences between the two
    providers' expression languages are not drift.

key_definitions:
  defaults: >-
    Provider-stock values applied only for Cloudflare zone settings: when a
    field's cloudflare path resolves to nothing and the setting id named in
    the path appears in defaults.cloudflare_settings, the listed value is the
    provider's documented stock behaviour. Compare it exactly as if it were
    present -- the absence is not drift and not a migration gap.
  domains: >-
    The domains this field applies to. A field with no domains: list applies
    to every domain.
  fixture: >-
    Names which attached document a side's `path` resolves against -- akamai:
    rules, hostnames, appsec; cloudflare: settings, rulesets, dns_records,
    zone.
  value_table: >-
    Names a table in `value_tables` translating each provider's vocabulary to
    a canonical value before comparison -- different tokens for the same
    meaning are not drift.
  value_translate: >-
    Literal substitutions applied to a resolved value before comparison,
    e.g. rendering a symbolic token into this domain's hostname.
  extract: >-
    A regex applied to each resolved value whose capture group replaces the
    value before comparison.
  extract_all: >-
    Splits a resolved string into every regex match before comparison.
  strip_prefix: >-
    Removes the named leading prefix from a resolved string value before
    comparison.
  split: >-
    Splits a resolved string on the separator into separate values before
    comparison.
  empty_means: >-
    Annotation naming the token this provider uses to represent an empty
    set (e.g. "[]") when the control is present but configures nothing.
  normalize: >-
    Annotation of the normalization applied to both sides before comparison
    (e.g. strip whitespace and quotes, lowercase).
  note: >-
    Free-text annotation about where an equivalent control lives or why a
    provider side is absent. Informational context, not a comparison rule.
  rule_format: >-
    The Akamai rule-tree format version this estate's exports use; version
    metadata only.

fields:
  # ---------- TLS and certificates ----------
  - id: tls.min_version
    description: Minimum TLS version accepted from clients
    severity: critical
    control_ref: "PCI-DSS 4.0 req 4.2.1"
    owner: edge-security
    comparator: semantic_enum_ge
    value_table: tls_min_version
    akamai:
      path: "$.rules.behaviors[?(@.name=='origin')].options.minTlsVersion"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='min_tls_version')].value"
  - id: tls.ssl_mode
    description: Cloudflare origin encryption mode (Akamai has no equivalent dial)
    severity: critical
    control_ref: "PCI-DSS 4.0 req 4.2.1"
    owner: edge-security
    comparator: semantic_enum
    value_table: ssl_mode
    akamai:
      unsupported: true
      note: "Akamai encrypts to origin per the origin behavior verificationMode; no ssl-mode equivalent"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='ssl')].value"
  - id: tls.client_ciphers
    description: TLS cipher suites offered to clients
    severity: high
    control_ref: "OSFI B-13 crypto hygiene"
    owner: edge-security
    comparator: set_equal
    akamai:
      unsupported: true
      note: "Cipher selection lives in the CPS enrollment, not the property rule tree"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='ciphers')].value"
  - id: tls.hsts_max_age
    description: HSTS max-age emitted at the edge
    severity: medium
    control_ref: "PCI-DSS 4.0 req 4.2.1"
    owner: edge-security
    comparator: numeric_ge
    extract: "max-age=(\\d+)"
    akamai:
      path: "$.rules.behaviors[?(@.options.customHeaderName=='Strict-Transport-Security')].options.customHeaderValue"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_response_headers_transform')].rules[?(@.description=='HSTS')].action_parameters.headers['Strict-Transport-Security'].value"
  # ---------- HTTP versions and protocol ----------
  - id: http.http2
    description: HTTP/2 to clients
    severity: medium
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='http2')].options.enabled"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='http2')].value"
  - id: http.http3
    description: HTTP/3 (QUIC) to clients
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='http3')].options.enabled"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='http3')].value"
  - id: http.zero_rtt
    description: TLS 0-RTT early data
    severity: medium
    control_ref: "OSFI B-13 replay-risk guidance"
    owner: edge-security
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='adaptiveAcceleration')].options.enableRo"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='0rtt')].value"
  - id: http.enhanced_protocol
    description: Enhanced Akamai Protocol to origin (Akamai-only)
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='enhancedAkamaiProtocol')].options.enabled"
    cloudflare:
      unsupported: true
      note: "Cloudflare has no equivalent proprietary origin protocol"
  - id: http.origin_max_version
    description: Maximum HTTP version to origin
    severity: low
    owner: edge-platform
    comparator: exact
    akamai:
      unsupported: true
      note: "Akamai origin HTTP version is set by product capabilities, not the rule tree"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='origin_max_http_version')].value"
  - id: http.websockets
    description: WebSocket support
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      unsupported: true
      note: "Akamai WebSocket support is product-level (Ion includes it)"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='websockets')].value"
  # ---------- Caching and TTLs ----------
  - id: caching.default_ttl
    description: Edge cache TTL applied by the default rule
    severity: medium
    owner: edge-platform
    comparator: duration_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='caching')].options.ttl"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='browser_cache_ttl')].value"
  - id: caching.cache_level
    description: Cloudflare cache level (Akamai cache behavior is per-rule)
    severity: medium
    owner: edge-platform
    comparator: exact
    akamai:
      unsupported: true
      note: "Cache aggressiveness is expressed per-rule on Akamai, not zone-wide"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='cache_level')].value"
  - id: caching.tiered_distribution
    description: Akamai tiered distribution (parent caching)
    severity: low
    owner: edge-platform
    comparator: bool_eq
    domains: [assets.rbcdemo.ca]
    akamai:
      path: "$.rules.behaviors[?(@.name=='tieredDistribution')].options.enabled"
    cloudflare:
      unsupported: true
      note: "Cloudflare tiered cache is account-level, not zone API"
  - id: caching.prefetch
    description: Object prefetching
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='prefetch')].options.enabled"
    cloudflare:
      unsupported: true
      note: "No Cloudflare equivalent; closest is Early Hints + prefetch rules"
  - id: caching.browser_revalidate
    description: must-revalidate on cached objects
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='caching')].options.mustRevalidate"
    cloudflare:
      unsupported: true
      note: "Cloudflare controls browser TTL via browser_cache_ttl, not revalidation flags"
  # ---------- Cache key composition ----------
  - id: cachekey.query_params_assets
    description: Query parameters included in the cache key (assets)
    severity: medium
    owner: edge-platform
    comparator: set_equal
    domains: [assets.rbcdemo.ca]
    akamai:
      path: "$.rules.behaviors[?(@.name=='cacheKeyQueryParams')].options.parameters"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_cache_settings')].rules[*].action_parameters.cache_key.custom_key.query_string.include"
  - id: cachekey.strategy_online
    description: Online banking cache key excludes all query params
    severity: high
    control_ref: "PCI-DSS 4.0 req 6.4.3 (cache poisoning surface)"
    owner: edge-security
    comparator: semantic_enum
    value_table: cache_key_mode
    domains: [online.rbcdemo.ca]
    akamai:
      path: "$.rules.behaviors[?(@.name=='cacheKeyQueryParams')].options.behavior"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_cache_settings')].rules[*].action_parameters.cache_key.custom_key.query_string.include"
      empty_means: "[]"
  - id: cachekey.remove_vary_api
    description: Vary header removed so JSON caches correctly (api)
    severity: low
    owner: edge-platform
    comparator: presence
    domains: [api.rbcdemo.ca]
    akamai:
      path: "$.rules.behaviors[?(@.name=='removeVary')].options.enabled"
    cloudflare:
      unsupported: true
      note: "Cloudflare ignores most Vary by default; no toggle in zone API"
  # ---------- Compression ----------
  - id: compression.gzip
    description: Gzip response to clients
    severity: low
    owner: edge-platform
    comparator: semantic_enum
    value_table: gzip_mode
    akamai:
      path: "$.rules.behaviors[?(@.name=='gzipResponse')].options.behavior"
    cloudflare:
      unsupported: true
      note: "Cloudflare compresses automatically; brotli is the only toggle"
  - id: compression.brotli
    description: Brotli compression
    severity: low
    owner: edge-platform
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='adaptiveAcceleration')].options.enableBrotliCompression"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='brotli')].value"
  - id: compression.image_polish
    description: Cloudflare Polish image optimization (approximates Akamai Image Manager)
    severity: low
    owner: edge-platform
    comparator: semantic_enum
    value_table: polish
    akamai:
      unsupported: true
      note: "Akamai Image Manager is a rule behavior (imageManager) with its own policy tokens"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='polish')].value"
  # ---------- Origin and failover ----------
  - id: origins.hostname_set
    description: Complete set of origin hostnames referenced anywhere in the tree
    severity: high
    control_ref: "OSFI B-13 change management"
    owner: edge-platform
    comparator: set_equal
    akamai:
      path: "$..behaviors[?(@.name=='origin')].options.hostname"
    cloudflare:
      unsupported: true
      note: "Cloudflare origin hostnames live in Load Balancer pools / origin rules, not in this export"
  - id: origins.failover
    description: Secondary origin failover policy (online banking)
    severity: high
    control_ref: "OSFI B-13 availability"
    owner: edge-platform
    comparator: presence
    domains: [online.rbcdemo.ca]
    akamai:
      path: "$.rules.children[?(@.name=='Origin failover')].children[*].behaviors[?(@.name=='originFailureRecoveryPolicy')].options.enabled"
    cloudflare:
      unsupported: true
      note: "Failover is a Cloudflare Load Balancer concern; not expressed as a zone ruleset"
  - id: origins.forward_host_header
    description: Host header forwarded to origin
    severity: medium
    owner: edge-platform
    comparator: exact
    akamai:
      path: "$.rules.behaviors[?(@.name=='origin')].options.forwardHostHeader"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_origin')].rules[?(@.description=='Route to origin pool')].action_parameters.host_header"
    value_translate:
      REQUEST_HOST_HEADER: "{domain}"

  - id: origins.true_client_ip
    description: True-Client-IP header handling end to end
    severity: medium
    control_ref: "OSFI B-13 logging integrity"
    owner: edge-security
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='origin')].options.enableTrueClientIp"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='true_client_ip_header')].value"
  # ---------- Security headers ----------
  - id: headers.security_static
    description: Static security headers (nosniff / DENY) via response transform
    severity: medium
    control_ref: "PCI-DSS 4.0 req 6.3.1 (security misconfiguration)"
    owner: edge-security
    comparator: presence
    domains: [online.rbcdemo.ca]
    akamai:
      path: "$.rules.behaviors[?(@.options.customHeaderName=='X-Content-Type-Options')].options.customHeaderValue"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_response_headers_transform')].rules[?(@.description=='security-headers')]"
      allow_absent: true
  - id: headers.csp
    description: Content-Security-Policy header on HTML (www)
    severity: medium
    control_ref: "PCI-DSS 4.0 req 6.4.3"
    owner: edge-security
    comparator: regex_equivalent
    normalize: "strip_whitespace_quotes"
    domains: [www.rbcdemo.ca]
    akamai:
      path: "$..behaviors[?(@.options.customHeaderName=='Content-Security-Policy')].options.customHeaderValue"
    cloudflare:
      unsupported: true
      note: "CSP not yet expressed as a CF response-header transform on this zone"
  # ---------- WAF and managed rulesets ----------
  - id: waf.managed_ruleset_enabled
    description: Managed WAF ruleset executing on all traffic
    severity: critical
    control_ref: "PCI-DSS 4.0 req 6.4.1"
    owner: edge-security
    comparator: bool_eq
    akamai:
      path: "$.rules.behaviors[?(@.name=='webApplicationFirewall')].options.enable"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_firewall_managed')].rules[?(@.description=='Execute Cloudflare Managed Ruleset')].enabled"
  - id: waf.owasp_sensitivity
    description: OWASP core ruleset sensitivity / paranoia level
    severity: high
    control_ref: "PCI-DSS 4.0 req 6.4.1"
    owner: edge-security
    comparator: semantic_enum
    value_table: sensitivity
    akamai:
      unsupported: true
      note: "Akamai attack-group actions live in the App Sec export, not a per-zone sensitivity dial"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_firewall_managed')].rules[?(@.description=='Execute OWASP Core Ruleset')].action_parameters.overrides.sensitivity_level"
  - id: waf.edge_toggle
    description: Zone-level WAF master switch
    severity: high
    control_ref: "PCI-DSS 4.0 req 6.4.1"
    owner: edge-security
    comparator: bool_eq
    akamai:
      unsupported: true
      note: "WAF enablement on Akamai is in the security config, not a zone setting"
    cloudflare:
      fixture: settings
      path: "$.result[?(@.id=='waf')].value"
  - id: waf.appsec_global_rate
    description: Global rate policy threshold (req/min) in the App Sec export
    severity: medium
    control_ref: "OSFI B-13 availability"
    owner: edge-security
    comparator: numeric_eq
    domains: [www.rbcdemo.ca, online.rbcdemo.ca]
    akamai:
      fixture: appsec
      path: "$.ratePolicies.items[?(@.id==9001)].averageThreshold"
    cloudflare:
      unsupported: true
      note: "Global rate policy is expressed per-rule in http_ratelimit, not as one threshold"
  # ---------- Rate limiting ----------
  - id: ratelimit.login
    description: Login endpoint rate limit (requests per period)
    severity: high
    control_ref: "PCI-DSS 4.0 req 8.3.4 (credential-stuffing controls)"
    owner: edge-security
    comparator: numeric_eq
    domains: [online.rbcdemo.ca]
    akamai:
      fixture: appsec
      path: "$.ratePolicies.items[?(@.id==9002)].averageThreshold"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_ratelimit')].rules[?(@.description=='Login rate limit')].ratelimit.requests_per_period"
  - id: ratelimit.partner_api
    description: Open-banking partner rate limit (requests/minute)
    severity: high
    control_ref: "OSFI B-13 third-party access"
    owner: edge-security
    comparator: numeric_eq
    domains: [api.rbcdemo.ca]
    akamai:
      fixture: appsec
      path: "$.ratePolicies.items[?(@.id==9101)].averageThreshold"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_ratelimit')].rules[?(@.description=='Open-banking partner rate')].ratelimit.requests_per_period"
  # ---------- Bot management ----------
  - id: bot.edge_layer
    description: Edge bot management layer enabled (www)
    severity: high
    control_ref: "PCI-DSS 4.0 req 6.4.2"
    owner: edge-security
    comparator: presence
    domains: [www.rbcdemo.ca]
    akamai:
      fixture: appsec
      path: "$.botManagement.enabled"
    cloudflare:
      unsupported: true
      note: "Cloudflare Bot Management is a separate subscription product; not in rulesets export"
  # ---------- Geo controls ----------
  - id: geo.blocked_countries
    description: Sanctioned-country geo block set
    severity: high
    control_ref: "OSFI B-13 / sanctions screening"
    owner: edge-security
    comparator: set_equal
    domains: [www.rbcdemo.ca]
    akamai:
      path: "$.rules.children[?(@.name=='Sanctioned countries')].criteria[?(@.name=='userLocation')].options.values"
      strip_prefix: "country:"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_request_firewall_custom')].rules[?(@.description=='Geo deny — sanctioned countries')].expression"
      extract_all: "\"([A-Z]{2})\""
  # ---------- CORS ----------
  - id: cors.allowed_origins
    description: CORS Access-Control-Allow-Origin set (api)
    severity: high
    control_ref: "PCI-DSS 4.0 req 6.4.3"
    owner: edge-security
    comparator: set_equal
    domains: [api.rbcdemo.ca]
    akamai:
      path: "$.rules.children[?(@.name=='CORS preflight')].behaviors[?(@.options.customHeaderName=='Access-Control-Allow-Origin')].options.customHeaderValue"
      split: ","
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_response_headers_transform')].rules[?(@.description=='CORS headers')].action_parameters.headers['Access-Control-Allow-Origin'].value"
      split: ","
  - id: cors.allow_credentials
    description: CORS Access-Control-Allow-Credentials (api)
    severity: medium
    owner: edge-security
    comparator: exact
    domains: [api.rbcdemo.ca]
    akamai:
      path: "$.rules.children[?(@.name=='CORS preflight')].behaviors[?(@.options.customHeaderName=='Access-Control-Allow-Credentials')].options.customHeaderValue"
    cloudflare:
      fixture: rulesets
      path: "$.result[?(@.phase=='http_response_headers_transform')].rules[?(@.description=='CORS headers')].action_parameters.headers['Access-Control-Allow-Credentials'].value"
  # ---------- Token auth ----------
  - id: auth.token_auth_downloads
    description: Token authorization required on protected download paths
    severity: high
    control_ref: "OSFI B-13 asset integrity"
    owner: edge-security
    comparator: bool_eq
    domains: [assets.rbcdemo.ca]
    akamai:
      path: "$.rules.children[?(@.name=='Downloads token auth')].behaviors[?(@.name=='verifyTokenAuthorization')].options.enabled"
    cloudflare:
      unsupported: true
      note: "Cloudflare equivalent would be signed URLs via Workers/Access; not in zone export"
  - id: auth.central_authorization
